<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing</title>
</head>
<body>
    <h1>Now Playing:</h1>
    <p id="current-song">Loading...</p>

    <script>
        const icecastURL = "http://ingest-us-west-01.audiocdn.com/phcys9pyfy7/64k.aac/status-json.xsl"; // Replace with your Icecast server URL

        async function fetchCurrentSong() {
            try {
                const response = await fetch(icecastURL);
                const data = await response.json();

                // Navigate to the source information in the JSON
                const source = data.icestats.source;
                let currentSong;

                // Handle single or multiple streams
                if (Array.isArray(source)) {
                    currentSong = source[0].title; // Modify to match your mount point if necessary
                } else {
                    currentSong = source.title;
                }

                document.getElementById("current-song").textContent = currentSong || "No song is currently playing.";
            } catch (error) {
                console.error("Error fetching Icecast data:", error);
                document.getElementById("current-song").textContent = "Unable to fetch song information.";
            }
        }

        // Update song information every 10 seconds
        setInterval(fetchCurrentSong, 10000);
        fetchCurrentSong(); // Initial fetch
    </script>
</body>
</html>
